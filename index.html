<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PressUp – Apartment Ironing</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d9;--ac:#0f6e56;--acx:#e1f5ee;--wn:#b4570a;--wnx:#fdf0e0;--er:#b3261e;--erx:#fcebea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161614;--sf:#211f1d;--tx:#f1efe8;--mu:#a09e95;--bd:#34322e;--ac:#5dcaa5;--acx:#0f3b2f;--wn:#f0a050;--wnx:#3a2814;--er:#f28b82;--erx:#3d1c1a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px}
h1{font-size:17px;margin:0 0 8px}h2{font-size:15px;margin:18px 0 8px}h3{font-size:14px;margin:0}
.roles,.tabs{display:flex;gap:6px;overflow-x:auto}
.roles button,.tabs button{flex:1;white-space:nowrap;padding:7px 10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.roles button.on,.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{margin-bottom:12px}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
input.s{width:70px}
.btn{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--er)}.btn.w{width:100%}.btn.sm{padding:6px 10px;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--acx);color:var(--ac)}
.pill.w{background:var(--wnx);color:var(--wn)}.pill.e{background:var(--erx);color:var(--er)}
.mu{color:var(--mu);font-size:13px}.warn{background:var(--wnx);color:var(--wn);padding:8px;border-radius:8px;font-size:13px;margin:6px 0}
.lbl{font-family:ui-monospace,monospace;background:var(--tx);color:var(--bg);padding:2px 8px;border-radius:5px;font-size:13px}
.steps{display:flex;gap:4px;margin:10px 0 4px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.steps i.d{background:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal div{border:1px solid var(--bd);border-radius:8px;padding:6px 2px;background:var(--bg)}.cal .on{background:var(--acx);border-color:var(--ac);color:var(--ac);font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.q{display:flex;gap:10px;align-items:center}.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;cursor:pointer}
svg g text{pointer-events:none}svg text{fill:var(--tx);font-family:system-ui;font-size:10px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:9}
input[type=checkbox]{width:24px;height:24px;margin:0}a{color:var(--ac)}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;gap:6px;background:var(--sf);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;min-height:46px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:13px;font-weight:600}.bn button.on{background:var(--ac);color:#fff}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--sf);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lc{border:2px dashed var(--tx);border-radius:12px;padding:14px;text-align:center;margin-bottom:12px}
@media(max-width:520px){main{padding:10px}input,select{font-size:16px}.btn{min-height:44px}.btn.sm{min-height:40px}.roles button{font-size:12px;padding:8px 4px}}
.ms{display:flex;gap:10px;align-items:flex-start;padding:4px 0}.ms b{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:var(--bd);color:var(--mu);flex:none}.ms.d b{background:var(--ac);color:#fff}.ms.c b{background:var(--wn);color:#fff}.av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}
</style></head><body>
<header><h1>PressUp <span class="mu">· demo data</span></h1>
<div class="roles" id="roles"></div></header>
<main id="app"></main>
<script>
const ST=['booked','accepted','collected','dropped','ironing','qc','approved','pickedup','delivered'];
const LB={booked:'Booked',accepted:'Pickup accepted',dropped:'Dropped to iron man',pickedup:'Picked up from iron man',collected:'Collected',ironing:'Being ironed',qc:'Quality check',approved:'Approved',out:'Out for delivery',delivered:'Delivered',flagged:'Issue flagged'};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const S={
 price:{Shirt:15,'T-shirt':10,Trousers:15,Kurta:20,Saree:40,Bedsheet:30},
 apts:[
  {id:1,name:'Sample Heights',area:'Whitefield',x:250,y:60,sch:{Mon:'7–9 AM',Thu:'6–8 PM',Sat:'8–10 AM'}},
  {id:2,name:'Lakeview Residency',area:'Bellandur',x:90,y:150,sch:{Tue:'7–9 AM',Fri:'6–8 PM'}},
  {id:3,name:'Green Park Towers',area:'Marathahalli',x:200,y:170,sch:{Wed:'6–8 PM',Sun:'9–11 AM'}},
  {id:4,name:'Orchid Enclave',area:'Panathur',x:300,y:130,sch:{Mon:'6–8 PM',Fri:'7–9 AM'}}],
 reqs:[],
 partners:[
  {id:1,name:'Lakshmi Press',area:'Whitefield',cap:60,av:'Mon–Sat, 9–7',ok:1,notes:[]},
  {id:2,name:'Ravi Iron Works',area:'Bellandur',cap:80,av:'Daily, 8–8',ok:1,notes:[]},
  {id:3,name:'Fresh Fold',area:'Marathahalli',cap:50,av:'Mon–Fri, 10–6',ok:1,notes:[]}],
 orders:[],n:1000,users:[],session:null
};
const KEY='pressup1';
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)Object.assign(S,x)}catch(e){}
let curRole='Customer',cs={tab:'apt',apt:null,cart:{},flat:'',pay:'UPI',q:'',name:'',phone:''},sf=0,pid=1,atab='Overview',tm;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const apt=id=>S.apts.find(a=>a.id==id);const pr=id=>S.partners.find(p=>p.id==id);
const code=o=>apt(o.apt).name.split(' ').map(w=>w[0]).join('').toUpperCase()+'-'+o.flat+'-'+o.id;
const cnt=o=>Object.values(o.items).reduce((a,b)=>a+b,0);
const partnersNear=a=>S.partners.filter(p=>p.ok&&p.area==a.area).length;
const load=p=>S.orders.filter(o=>o.partner==p.id&&['dropped','ironing','qc'].includes(o.status)).reduce((a,o)=>a+cnt(o),0);
function toast(t){clearTimeout(tm);document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);tm=setTimeout(()=>d.remove(),2200)}
function steps(o){const i=o.status=='flagged'?5:ST.indexOf(o.status);return '<div class="steps">'+ST.map((s,k)=>`<i class="${k<=i?'d':''}"></i>`).join('')+'</div>'}
function pill(o){return `<span class="pill ${o.status=='flagged'?'e':''}">${LB[o.status]}</span>`}
function R(){
 $('roles').innerHTML=S.session?`<span class="mu" style="flex:1;align-self:center">${S.session=='admin'?'Admin':esc((me()||{}).name||'')}</span><button style="flex:0 0 auto" id="lo" onclick="appLogout()">Log out</button>`:'';
 stamp();$('app').innerHTML=S.session?gate():login();
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
/* ---------- CUSTOMER ---------- */
function cust(){
 const tabs=[['apt','Nearby'],['book','Book'],['track','My orders']];
 let h='<div class="tabs">'+tabs.map(t=>`<button class="${cs.tab==t[0]?'on':''}" onclick="cs.tab='${t[0]}';R()">${t[1]}</button>`).join('')+'</div>';
 return h+({apt:cNear,book:cBook,track:cTrack}[cs.tab])();
}
function cApt(){
 const a=cs.apt&&apt(cs.apt);
 const list=S.apts.filter(x=>(x.name+x.area).toLowerCase().includes(cs.q.toLowerCase()));
 let h=`<input placeholder="Search apartment or area in Bangalore" value="${esc(cs.q)}" oninput="cs.q=this.value;R();const i=document.querySelector('input');i.focus();i.setSelectionRange(99,99)">`;
 h+=`<svg viewBox="0 0 360 220" width="100%" style="background:var(--acx);border-radius:12px;margin:8px 0"><path d="M0 110 Q120 90 180 120 T360 100M170 0 Q180 100 160 220" stroke="var(--bd)" stroke-width="8" fill="none"/>`+
 S.apts.map(x=>{const n=partnersNear(x),on=x.id==cs.apt;return `<g onclick="cs.apt=${x.id};R()" style="cursor:pointer"><circle cx="${x.x}" cy="${x.y}" r="${on?16:13}" fill="${n?'var(--ac)':'var(--mu)'}"/><text x="${x.x}" y="${x.y+4}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:12px">${n}</text><text x="${x.x}" y="${x.y+28}" text-anchor="middle">${esc(x.name.split(' ')[0])}</text></g>`}).join('')+'</svg>';
 h+='<div class="mu">Pins show ironing partners available near each apartment.</div><h2>Apartments</h2>';
 h+=list.map(x=>`<div class="card row" onclick="cs.apt=${x.id};R()" style="cursor:pointer;${x.id==cs.apt?'border-color:var(--ac)':''}"><div><h3>${esc(x.name)}</h3><span class="mu">${x.area} · ${partnersNear(x)} partner(s) nearby</span></div>${x.id==cs.apt?'<span class="pill">Selected</span>':''}</div>`).join('')||'<div class="mu">No match.</div>';
 h+=`<div class="card"><h3>Apartment not listed?</h3><input id="rn" placeholder="Apartment name"><input id="ra" placeholder="Area (e.g. HSR Layout)"><button class="btn g w" onclick="reqApt()">Request to add apartment</button></div>`;
 if(S.reqs.length)h+=S.reqs.map(r=>`<div class="mu">Request: ${esc(r.name)} – <span class="pill w">${r.ok?'Approved':'Pending'}</span></div>`).join('');
 if(a){h+=`<h2>Collection schedule · ${esc(a.name)}</h2><div class="cal">`+DAYS.map(d=>`<div class="${a.sch[d]?'on':''}">${d}<br>${a.sch[d]||'–'}</div>`).join('')+'</div><button class="btn w" style="margin-top:12px" onclick="cs.tab=\'book\';R()">Book a pickup</button>'}
 return h;
}
function reqApt(){const n=$('rn').value.trim(),a=$('ra').value.trim();if(!n||!a)return toast('Enter name and area');S.reqs.push({name:n,area:a,ok:0});toast('Request sent to admin');R()}
function cBook(){
 const a=cs.apt&&apt(cs.apt);if(!a)return '<div class="card">Select an apartment first.</div>';
 const tot=Object.entries(cs.cart).reduce((s,[k,q])=>s+q*S.price[k],0),n=Object.values(cs.cart).reduce((a,b)=>a+b,0);
 const days=Object.keys(a.sch);
 let h=`<div class="card"><h3>${esc(a.name)}</h3><span class="mu">Pickup slots: ${days.map(d=>d+' '+a.sch[d]).join(' · ')}</span><select id="slot">${days.map(d=>`<option>${d} ${a.sch[d]}</option>`).join('')}</select><input id="flat" placeholder="Flat number (e.g. B-402)" value="${esc(cs.flat)}" oninput="cs.flat=this.value"><input placeholder="Your name" value="${esc(cs.name)}" oninput="cs.name=this.value"><input placeholder="Phone" value="${esc(cs.phone)}" oninput="cs.phone=this.value"><div class="mu">Flat and contact details are visible only to authorised staff.</div></div>`;
 h+='<div class="card">'+Object.keys(S.price).map(k=>`<div class="item"><div>${k}<div class="mu">₹${S.price[k]} each</div></div><div class="q"><button onclick="qty('${k}',-1)">−</button><b>${cs.cart[k]||0}</b><button onclick="qty('${k}',1)">+</button></div></div>`).join('')+`<div class="row" style="margin-top:10px"><b>${n} items</b><b>₹${tot}</b></div></div>`;
 h+=`<div class="card"><h3>Pay</h3><select onchange="cs.pay=this.value">${['UPI','Card','Net banking'].map(p=>`<option ${p==cs.pay?'selected':''}>${p}</option>`).join('')}</select><div class="mu">Demo payment – no real charge.</div></div>`;
 return h+`<button class="btn w" onclick="placeOrder(${tot})">Pay ₹${tot} &amp; confirm booking</button>`;
}
function qty(k,d){cs.cart[k]=Math.max(0,(cs.cart[k]||0)+d);R()}
function placeOrder(t){
 const items={};Object.entries(cs.cart).forEach(([k,q])=>q&&(items[k]=q));
 if(!cs.flat.trim())return toast('Enter flat number');if(!t)return toast('Add some clothes');
 if(!cs.name.trim()||!cs.phone.trim())return toast('Enter your name and phone');
 const o={id:++S.n,apt:cs.apt,flat:cs.flat.trim(),name:cs.name.trim(),phone:cs.phone.trim(),slot:$('slot').value,items,total:t,status:'booked',uid:S.session,payout:null};lg(o,'Booking confirmed & paid ₹'+t);S.orders.push(o);
 cs.cart={};cs.tab='track';toast('Booking confirmed');R()}
function cTrack(){
 const os=S.orders.filter(o=>o.uid==S.session).reverse();
 return os.map(o=>`<div class="card"><div class="row"><h3>Order #${o.id}</h3>${pill(o)}</div><div class="mu">${esc(apt(o.apt).name)} · ${o.slot} · ${cnt(o)} items · ₹${o.total}</div>${miles(o)}${pkBox(o)}<div class="mu">${(o.log||[]).slice().reverse().map(l=>l[1]+' – '+esc(l[0])).join('<br>')}</div>${o.status=='booked'?`<button class="btn g sm" style="margin-top:8px" onclick="cancelO(${o.id})">Cancel booking</button>`:''}</div>`).join('')||'<div class="card mu">No orders yet.</div>';
}
/* ---------- STAFF ---------- */
function staff(){
 const by=s=>S.orders.filter(o=>s.includes(o.status)&&(!sf||o.apt==sf));
 const card=(o,body)=>`<div class="card"><div class="row"><span class="lbl">${esc(code(o))}</span>${pill(o)}</div><div class="mu" style="margin:6px 0">${esc(apt(o.apt).name)} · Flat ${esc(o.flat)} · ${o.slot}${o.name?' · '+esc(o.name)+' '+esc(o.phone):''}<br>${Object.entries(o.items).map(([k,q])=>q+'× '+k).join(', ')} (${cnt(o)})</div>${body}</div>`;
 let h=`<select onchange="sf=+this.value;R()"><option value="0">All apartments</option>${S.apts.map(a=>`<option value="${a.id}" ${a.id==sf?'selected':''}>${esc(a.name)}</option>`).join('')}</select><h2>Pickups</h2>`+(by(['booked']).map(o=>card(o,`<div class="row"><input class="s" id="c${o.id}" type="number" value="${cnt(o)}"><button class="btn sm" onclick="collect(${o.id})">Record &amp; label bundle</button></div>`)).join('')||'<div class="mu">No pickups pending.</div>');
 h+='<h2>Quality check</h2>'+(by(['qc','flagged']).map(o=>card(o,(o.warn?`<div class="warn">⚠ ${esc(o.warn)}</div>`:'')+(o.flag?`<div class="warn">Flagged: ${esc(o.flag)}</div>`:'')+(o.status=='qc'?`<div class="row"><button class="btn sm" onclick="approve(${o.id})">${o.warn?'Approve anyway':'Approve'}</button><button class="btn sm r" onclick="flag(${o.id})">Flag issue</button></div>`:`<button class="btn sm g" onclick="rework(${o.id})">Send back to partner</button>`))).join('')||'<div class="mu">Nothing awaiting QC.</div>');
 h+='<h2>Delivery</h2>'+(by(['approved']).map(o=>card(o,`<button class="btn sm" onclick="deliver(${o.id})">Mark delivered</button>`)).join('')||'<div class="mu">Nothing to deliver.</div>');
 return h;
}
function pick(o){const a=apt(o.apt),n=cnt(o);const ok=S.partners.filter(p=>p.ok);return ok.find(p=>p.area==a.area&&p.cap-load(p)>=n)||ok.find(p=>p.cap-load(p)>=n)||ok[0]}
function collect(id){const o=S.orders.find(x=>x.id==id),v=+$('c'+id).value;o.collected=v;o.status='collected';lg(o,'Collected & labelled '+code(o));o.partner=pick(o).id;if(v!=cnt(o))o.warn='Collected '+v+' vs booked '+cnt(o);toast('Labelled '+code(o));R()}
function approve(id){const o=S.orders.find(x=>x.id==id);o.status='approved';lg(o,'Ironed & approved – ready for pickup');o.payout=Math.round(o.total*.7);o.paid=0;pr(o.partner).notes.push('Order '+code(o)+' approved – ₹'+o.payout+' payout queued');toast('Approved');R()}
function flag(id){const o=S.orders.find(x=>x.id==id),r=prompt('Describe the issue');if(!r)return;o.flag=r;o.status='flagged';lg(o,'Quality issue found – being fixed');toast('Flagged');R()}
function rework(id){const o=S.orders.find(x=>x.id==id);o.status='ironing';lg(o,'Re-ironing in progress');o.flag=null;o.warn=null;toast('Sent back');R()}
function deliver(id){const o=S.orders.find(x=>x.id==id);o.status='delivered';lg(o,'Delivered to your door');toast('Delivered');R()}
/* ---------- PARTNER ---------- */
function partner(){
 const p=pr(me().pid);pid=p.id;
 const os=S.orders.filter(o=>o.partner==p.id),earn=os.filter(o=>o.payout);
 let h=`<h2 style="margin-top:0">${esc(p.name)} <span class="pill">Verified</span></h2>`;
 h+=`<div class="card"><div class="row"><div><h3>Daily capacity</h3><span class="mu">${esc(p.area)} · ${esc(p.av)} · in use ${load(p)}</span></div><input class="s" type="number" value="${p.cap}" onchange="pr(${p.id}).cap=+this.value;R()"></div></div>`;
 if(p.notes.length)h+='<h2>Notifications</h2>'+p.notes.slice(-3).reverse().map(n=>`<div class="warn" style="background:var(--acx);color:var(--ac)">🔔 ${esc(n.text||n)}${n.tel?` · <a href="tel:${esc(n.tel)}">Call ${esc(n.who||'')}</a>`:''}</div>`).join('');
 h+='<h2>Assigned bundles</h2>'+(os.slice().reverse().map(o=>{
  let b='';
  if(o.status=='dropped')b=`<div class="mu">Expected ${o.collected} · ${esc(ite(o))}</div>${pkBox(o,1)}<div class="row"><input class="s" id="r${o.id}" type="number" value="${o.collected}"><button class="btn sm" onclick="recv(${o.id})">Confirm received</button></div>`;
  else if(o.status=='ironing')b=`<div class="mu">Received ${o.received}</div><div class="row"><input class="s" id="d${o.id}" type="number" value="${o.received}"><button class="btn sm" onclick="done(${o.id})">Submit for quality check</button></div>`;
  else if(o.status=='flagged')b=`<div class="warn">Flagged by QC: ${esc(o.flag)}</div>`;
  return `<div class="card"><div class="row"><span class="lbl">${esc(code(o))}</span>${pill(o)}</div><div class="mu" style="margin:6px 0">${esc(apt(o.apt).name)} · Flat ${esc(o.flat)} · ${o.collected} pcs</div>${b}</div>`}).join('')||'<div class="mu">No bundles assigned.</div>');
 h+=`<h2>Earnings</h2><div class="card"><div class="row"><span>Pending payout</span><b>₹${earn.filter(o=>!o.paid).reduce((s,o)=>s+o.payout,0)}</b></div><div class="row"><span>Paid</span><b>₹${earn.filter(o=>o.paid).reduce((s,o)=>s+o.payout,0)}</b></div></div>`;
 h+=''&&`<h2>Register as a new partner</h2><div class="card"><input id="pn" placeholder="Name"><input id="pa" placeholder="Service location / area"><input id="pc" type="number" placeholder="Daily capacity (clothes)"><input id="pv" placeholder="Availability (e.g. Mon–Sat, 9–6)"><button class="btn g w" onclick="regP()">Submit application</button></div>`;
 return h;
}
function recv(id){const o=S.orders.find(x=>x.id==id);o.received=+$('r'+id).value;o.status='ironing';lg(o,'Received by '+pr(o.partner).name+' – ironing started');if(o.received!=o.collected)o.warn='Partner received '+o.received+' vs collected '+o.collected;R()}
function done(id){const o=S.orders.find(x=>x.id==id),v=+$('d'+id).value;o.doneQty=v;if(v!=o.received)o.warn=(o.warn?o.warn+'; ':'')+'Ironed '+v+' vs received '+o.received;o.status='qc';lg(o,'Ironed – at quality check');ntP('Ironed, ready for quality check: '+code(o)+' at '+pr(o.partner).name,pr(o.partner).phone,pr(o.partner).name);toast('Submitted to QC');R()}
function regP(){const n=$('pn').value.trim(),a=$('pa').value.trim();if(!n||!a)return toast('Enter name and area');S.partners.push({id:Date.now(),name:n,area:a,cap:+$('pc').value||30,av:$('pv').value||'TBD',ok:0,notes:[]});toast('Application sent');R()}
/* ---------- ADMIN ---------- */
function admin(){
 const T=['Overview','Approvals','Setup','Pricing','Payouts'];
 let h='<div class="tabs">'+T.map(t=>`<button class="${atab==t?'on':''}" onclick="atab='${t}';R()">${t}</button>`).join('')+'</div>';
 if(atab=='Overview'){
  h+=`<div class="row wrap">`+ST.concat('flagged').map(s=>`<div class="card" style="flex:1;min-width:90px;text-align:center"><b style="font-size:20px">${S.orders.filter(o=>o.status==s).length}</b><div class="mu">${LB[s]}</div></div>`).join('')+'</div>';
