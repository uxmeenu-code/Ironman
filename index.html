<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a4a">
<title>Ironing Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#eef1f7;--sf:#fff;--tx:#17203a;--mu:#6c7589;--bd:#e3e7f0;--nv:#1f2a4a;--on:#fff;--tint:#eef1fb;--ok:#1f9d6b;--okx:#e3f5ec;--wn:#b4570a;--wnx:#fdf0e0;--er:#c0392b;--erx:#fdeceb;--blb:#e6f0fb;--blf:#2a5ba8;--grb:#e3f4ec;--grf:#1d7a52;--pub:#ece9fb;--puf:#5a45b5}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f1c;--sf:#151b2e;--tx:#eef1fa;--mu:#9aa3bb;--bd:#2a324b;--nv:#6f86e0;--on:#0b0f1c;--tint:#1d2540;--ok:#4cc79a;--okx:#12372b;--wn:#f0a050;--wnx:#3a2814;--er:#f28b82;--erx:#3d1c1a;--blb:#1b2c47;--blf:#8db8f2;--grb:#143528;--grf:#6fd3a5;--pub:#272244;--puf:#b3a5f2}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#shell{max-width:440px;margin:0 auto;min-height:100vh;background:var(--sf);position:relative;box-shadow:0 0 40px rgba(20,30,70,.08)}
#app{padding:18px 16px calc(104px + env(safe-area-inset-bottom,0px))}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--sf);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
#nav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;min-height:50px;position:relative;cursor:pointer;justify-content:center}
#nav button.on{color:var(--nv);font-weight:700}
#nav em{position:absolute;top:2px;left:calc(50% + 6px);background:var(--er);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
h1,h2,h3{margin:0}.ttl{font-size:22px;font-weight:700;margin:0 0 6px}h3{font-size:15px}.sec{margin:20px 0 10px;font-size:16px;font-weight:700}
.big{font-size:24px;font-weight:700;margin:24px 0 4px}
.ic{flex:none;display:block}.grow{flex:1;min-width:0}.center{text-align:center}
.mu{color:var(--mu);font-size:13px}a{color:var(--nv);font-weight:600}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.row2{display:flex;gap:12px;align-items:center}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px}.hi{font-size:20px;font-weight:700}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;object-fit:cover;flex:none}
.bell{position:relative;background:none;border:0;color:var(--tx);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell i{position:absolute;top:4px;right:2px;background:var(--er);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.hdr{display:flex;gap:6px;align-items:center;margin-bottom:12px}.hdr h2{font-size:20px}
.bk{background:none;border:0;color:var(--tx);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:-8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;color:var(--tx)}
button.card{display:flex;width:100%;font:inherit;text-align:left;cursor:pointer}
.nx{display:flex;gap:12px;align-items:center}.tint{background:var(--tint);border-color:transparent}
.ico{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--nv);display:flex;align-items:center;justify-content:center;flex:none}.ico.sm{width:36px;height:36px;border-radius:10px}
.fsel{position:relative}.fsel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 10px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:13px;color:var(--tx);cursor:pointer}
.tile .ic{color:var(--nv)}
.lnk{background:none;border:0;color:var(--nv);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.tg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--tint);color:var(--nv)}
.tg-Home{background:#cfe3fb;color:#1c4f95}.tg-Friend{background:#e1d8fb;color:#5a3fb0}.tg-Mom{background:#fde3c4;color:#9a5200}
@media(prefers-color-scheme:dark){.tg-Home{background:#1e3558;color:#9cc4f5}.tg-Friend{background:#2e2552;color:#c2b6f5}.tg-Mom{background:#4a3010;color:#f4bd7b}}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit;font-size:16px;margin:4px 0}
input.s{width:76px;text-align:center}input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--nv);flex:none}input[type=file]{border:0;padding:6px 0}
.btn{padding:0 16px;min-height:50px;border:0;border-radius:14px;background:var(--nv);color:var(--on);font:inherit;font-weight:600;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--er);color:#fff}.btn.w{width:100%}.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn+.btn{margin-top:8px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--okx);color:var(--ok);white-space:nowrap}
.pill.w{background:var(--wnx);color:var(--wn)}.pill.e{background:var(--erx);color:var(--er)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--tint);color:var(--tx)}
.warn{background:var(--wnx);color:var(--wn);padding:10px 12px;border-radius:12px;font-size:13px;margin:8px 0}
.lbl{font-family:ui-monospace,monospace;background:var(--tx);color:var(--sf);padding:2px 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.seg{display:flex;background:var(--tint);border-radius:14px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:11px 4px;font:inherit;font-weight:600;font-size:14px;color:var(--tx);cursor:pointer}
.seg button.on{background:var(--nv);color:var(--on)}
.chips{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.chips button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}.chips button.on{background:var(--nv);color:var(--on);border-color:var(--nv)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0}
.days button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;padding:10px 0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;position:relative}
.days button.on{background:var(--nv);color:var(--on);border-color:var(--nv)}.days button.has::after{content:"";position:absolute;bottom:4px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--ok)}
.sl{display:flex;gap:12px;align-items:center}
.two,.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;gap:12px;align-items:center;color:var(--nv)}.stat b{font-size:24px;display:block;color:var(--tx);line-height:1.1}.stat span{font-size:13px;color:var(--mu)}
.stat2{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px;color:var(--nv);margin:0}.stat2 b{font-size:24px;color:var(--tx)}.stat2 span{font-size:13px;color:var(--mu)}
.g2{margin-bottom:12px}
.dd{display:flex;gap:12px;align-items:center}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.it:last-of-type{border-bottom:0}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.item:last-child{border-bottom:0}
.q{display:flex;gap:10px;align-items:center}.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:18px;cursor:pointer}
.tot{margin-top:10px;padding-top:12px;border-top:1px dashed var(--bd);font-size:16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.kv:last-child{border-bottom:0}.kv b{text-align:right;font-weight:600}
.pb{height:8px;border-radius:99px;background:var(--tint);margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok);border-radius:99px}
.done,.wait{text-align:center;padding:30px 0 16px}.done h1,.wait h2{margin:10px 0 4px}.bigok{color:var(--ok);display:inline-flex}
.out{margin-top:6px;color:var(--er)}
.lc2{border:2px dashed var(--bd);border-radius:12px;padding:12px;text-align:center;margin:8px 0}.lc2 .lbl{font-size:18px}
.map{width:100%;background:var(--tint);border-radius:16px;margin:8px 0;display:block}.map text{fill:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:10px;pointer-events:none}
.logo{text-align:center;padding:34px 0 8px;color:var(--nv)}.logo .ic{margin:0 auto}.logo h1{font-size:28px;margin-top:6px;color:var(--tx)}
.rc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;font:inherit;color:var(--tx);cursor:pointer}
.rc.on{border:2px solid var(--nv);background:var(--tint);padding:13px}.rc b{display:block;font-size:16px}.rc .mu{display:block}
.ric{width:52px;display:flex;justify-content:center;color:var(--nv)}.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);flex:none;position:relative}
.rc.on .rad{border-color:var(--nv)}.rc.on .rad::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--nv)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}.tabs button.on{background:var(--nv);color:var(--on);border-color:var(--nv)}
.steps{display:flex;gap:4px;margin:10px 0 4px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.steps i.d{background:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}.cal div{border:1px solid var(--bd);border-radius:8px;padding:6px 2px}.cal .on{background:var(--okx);border-color:var(--ok);color:var(--ok);font-weight:600}
.ms{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}.ms:last-child{padding-bottom:0}
.ms:not(:last-child)::after{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--bd)}.ms.d:not(:last-child)::after{background:var(--ok)}
.ms b{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:var(--bd);color:var(--mu);flex:none}
.ms.d b{background:var(--ok);color:#fff}.ms.c b{background:var(--sf);color:var(--nv);border:2px solid var(--nv)}
.ms.c>div{font-weight:700}.ms .mu{font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--sf);padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;max-width:90%;text-align:center}
@media(max-width:520px){#shell{box-shadow:none}}
</style></head><body>
<div id="shell"><main id="app"></main><nav id="nav" aria-label="Main"></nav></div>
<script>

const ST=['booked','accepted','collected','dropped','ironing','qc','approved','pickedup','delivered'];
const LB={booked:'Booked',accepted:'Pickup accepted',dropped:'Dropped to iron man',pickedup:'Picked up from iron man',collected:'Collected',ironing:'Being ironed',qc:'Quality check',approved:'Approved',out:'Out for delivery',delivered:'Delivered',flagged:'Issue flagged'};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const S={
 price:{Shirt:15,'T-shirt':10,Trousers:15,Kurta:20,Saree:40,Bedsheet:30},
 apts:[
  {id:1,name:'Prestige Lakeside',area:'Whitefield',x:250,y:60,sch:{Mon:'7–9 AM',Thu:'6–8 PM',Sat:'8–10 AM'}},
  {id:2,name:'Sobha Dreams',area:'Bellandur',x:90,y:150,sch:{Tue:'7–9 AM',Fri:'6–8 PM'}},
  {id:3,name:'Brigade Cornerstone',area:'Marathahalli',x:200,y:170,sch:{Wed:'6–8 PM',Sun:'9–11 AM'}},
  {id:4,name:'Orchid Enclave',area:'Panathur',x:300,y:130,sch:{Mon:'6–8 PM',Fri:'7–9 AM'}}],
 reqs:[],
 partners:[
  {id:1,name:'Lakshmi Press',area:'Whitefield',cap:60,av:'Mon–Sat, 9–7',ok:1,notes:[]},
  {id:2,name:'Ravi Iron Works',area:'Bellandur',cap:80,av:'Daily, 8–8',ok:1,notes:[]},
  {id:3,name:'Fresh Fold',area:'Marathahalli',cap:50,av:'Mon–Fri, 10–6',ok:1,notes:[]}],
 orders:[],n:1000,users:[],session:null
};
const KEY='pressup2';
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)Object.assign(S,x)}catch(e){}
let cs={},sf=0,pid=1,atab='Overview',tm;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const apt=id=>S.apts.find(a=>a.id==id);const pr=id=>S.partners.find(p=>p.id==id);
const code=o=>apt(o.apt).name.split(' ').map(w=>w[0]).join('').toUpperCase()+'-'+String(o.id).slice(-3);
const cnt=o=>Object.values(o.items).reduce((a,b)=>a+b,0);
const partnersNear=a=>S.partners.filter(p=>p.ok&&p.area==a.area).length;
const load=p=>S.orders.filter(o=>o.partner==p.id&&['dropped','ironing','qc'].includes(o.status)).reduce((a,o)=>a+cnt(o),0);
function toast(t){clearTimeout(tm);document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);tm=setTimeout(()=>d.remove(),2200)}
function steps(o){const i=o.status=='flagged'?5:ST.indexOf(o.status);return '<div class="steps">'+ST.map((s,k)=>`<i class="${k<=i?'d':''}"></i>`).join('')+'</div>'}
function pill(o){return `<span class="pill ${o.status=='flagged'?'e':''}">${LB[o.status]}</span>`}
/* ---------- CUSTOMER ---------- */
/* ---------- STAFF ---------- */
function approve(id){const o=S.orders.find(x=>x.id==id);o.status='approved';lg(o,'Ironed & approved – ready for pickup');o.payout=Math.round(o.total*.7);o.paid=0;pr(o.partner).notes.push('Order '+code(o)+' approved – ₹'+o.payout+' payout queued');toast('Approved');R()}
function rework(id){const o=S.orders.find(x=>x.id==id);o.status='ironing';lg(o,'Re-ironing in progress');o.flag=null;o.warn=null;o.prog={};toast('Sent back');R()}
function deliver(id){const o=S.orders.find(x=>x.id==id);o.status='delivered';lg(o,'Delivered to your door');toast('Delivered');R()}
/* ---------- PARTNER ---------- */
/* ---------- ADMIN ---------- */
function admin(){
 let h='<h1 class="ttl">'+atab+'</h1>';
 if(atab=='Overview'){
  h+=`<div class="row wrap">`+ST.concat('flagged').map(s=>`<div class="card" style="flex:1;min-width:90px;text-align:center"><b style="font-size:20px">${S.orders.filter(o=>o.status==s).length}</b><div class="mu">${LB[s]}</div></div>`).join('')+'</div>';
  h+=S.orders.slice().reverse().map(o=>`<div class="card"><div class="row"><b>#${o.id} · ${esc(apt(o.apt).name)} · ${esc(o.flat)}</b>${pill(o)}</div><div class="mu">${cnt(o)} items · ₹${o.total}${o.partner?' · '+esc(pr(o.partner).name):''}</div>${o.warn?`<div class="warn">⚠ ${esc(o.warn)}</div>`:''}${steps(o)}${['dropped','ironing'].includes(o.status)?`<select onchange="reas(${o.id},this.value)">${S.partners.filter(p=>p.ok).map(p=>`<option value="${p.id}" ${p.id==o.partner?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}</div>`).join('')||'<div class="card mu">No bookings yet. Book one in the Customer view.</div>';
  h+='<h2>Apartments &amp; schedules</h2>'+S.apts.map(a=>`<div class="card"><b>${esc(a.name)}</b> <span class="mu">${a.area}</span><div class="mu">${Object.keys(a.sch).map(d=>d+' '+a.sch[d]).join(' · ')}</div></div>`).join('');
 }
 if(atab=='Approvals'){
  const pr1=S.reqs.filter(r=>!r.ok),pp=S.partners.filter(p=>!p.ok);
  h+='<h3>Apartment requests</h3>'+(pr1.map(r=>`<div class="card row"><div><b>${esc(r.name)}</b><div class="mu">${esc(r.area)} · ${esc(r.addr||'')}</div></div><button class="btn sm" onclick="apApt(${S.reqs.indexOf(r)})">Approve</button></div>`).join('')||'<div class="mu">None pending.</div>');
  h+=pickAppr();void(pp.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><div class="mu">${esc(p.area)} · ${p.cap}/day · ${esc(p.av)}</div></div><button class="btn sm" onclick="pr(${p.id}).ok=1;R()">Approve</button></div>`).join('')||'<div class="mu">None pending.</div>');
 }
 if(atab=='Setup'){
  h+=`<div class="card"><h3>Add apartment</h3><input id="sn" placeholder="Name"><input id="sa" placeholder="Area"><button class="btn w" onclick="addApt()">Add apartment</button></div>`;
  h+=S.apts.map(a=>`<div class="card"><b>${esc(a.name)}</b> <span class="mu">${esc(a.area)}</span><div class="mu">Pickup timing per day (blank = no pickup)</div>${DAYS.map(d=>`<div class="row"><span>${d}</span><input style="width:150px" value="${esc(a.sch[d]||'')}" placeholder="e.g. 7–9 AM" onchange="setSch(${a.id},'${d}',this.value)"></div>`).join('')}<button class="btn g sm" style="margin-top:6px" onclick="delApt(${a.id})">Remove</button></div>`).join('');
  h+='<h2>Active partners</h2>'+S.partners.filter(p=>p.ok).map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><div class="mu">${esc(p.area)} · ${p.cap}/day</div><div class="mu">${mapA(p)}</div></div><button class="btn g sm" onclick="pr(${p.id}).ok=0;R()">Deactivate</button></div>`).join('');
  h+='<button class="btn g w" style="margin-top:12px" onclick="resetD()">Reset demo data</button>';
 }
 if(atab=='Pricing')h+=Object.keys(S.price).map(k=>`<div class="card row"><b>${k}</b><div>₹ <input class="s" type="number" value="${S.price[k]}" onchange="S.price['${k}']=+this.value;toast('Price updated')"></div></div>`).join('');
 if(atab=='Payouts'){
  const L=S.orders.filter(o=>o.payout);
  h+=L.map(o=>`<div class="card row"><div><b>${esc(pr(o.partner).name)}</b><div class="mu">${esc(code(o))} · ₹${o.payout}</div></div>${o.paid?'<span class="pill">Paid</span>':`<button class="btn sm" onclick="S.orders.find(x=>x.id==${o.id}).paid=1;toast('Payout released');R()">Release ₹${o.payout}</button>`}</div>`).join('')||'<div class="card mu">Payouts appear here once QC approves an order.</div>';
 }
 return h;
}
function apApt(i){const r=S.reqs[i];r.ok=1;const nid=Date.now();const ru=S.users.find(u=>u.id==r.uid)||{};ru.apt=ru.apt||nid;(ru.flats||[]).forEach(f=>{if(f.rid&&f.rid==r.rid)f.apt=nid});S.apts.push({id:nid,addr:r.addr,name:r.name,area:r.area,x:40+Math.random()*280,y:40+Math.random()*140,sch:{Tue:'7–9 AM',Sat:'8–10 AM'}});toast('Apartment added with default schedule');R()}
function lg(o,t){(o.log=o.log||[]).push([t,new Date().toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})])}

 const u=me(),fs=flatsOf(u),f=fs.find(x=>x.id==id);
 if(fs.length<2)return toast('You need at least one flat');
 if(S.orders.some(o=>o.uid==u.id&&o.apt==f.apt&&o.flat==f.flat&&o.status!='delivered'))return toast('This flat has active orders');
 u.flats=fs.filter(x=>x.id!=id);V.fl=0;V.sub=null;toast('Flat removed');R();
}
function profV(u){
 let det='';
 if(u.type=='ironman'){const p=pr(u.pid);det=kv('Shop',p.name)+kv('Address',p.addr)+kv('Area',p.area)+kv('Availability',p.av)+`<div class="kv"><span class="mu">Daily capacity</span><input class="s" id="pcap" type="number" min="1" value="${p.cap}" onchange="pr(${p.id}).cap=+this.value||1;toast('Capacity updated');R()"></div>`+kv('Currently in use',load(p))}
 else if(u.type=='pickup'){const d=u.docs||{};det=kv('Home address',d.addr)+kv('Vehicle',d.veh)+kv('Licence',d.lic)}
 else det=kv('Flats',flatsOf(u).length+' saved');
 return `<h1 class="ttl">Profile</h1><div class="card row2">${av(u)}<div><b>${esc(u.name)}</b><div class="mu">${RC[u.type].t}</div></div></div><div class="card">${kv('Mobile',u.phone)}${kv('Email',u.email)}${det}</div><button id="lo" class="btn g w out" onclick="appLogout()">${ic('out',20)} Log out</button>`;
}
/* ================= pickup person ================= */
function aptRows(u,kind){
 const td=DAYS[(new Date().getDay()+6)%7];
 const src=kind=='pickup'?OB(['booked','accepted']).concat(OB(['collected']).filter(o=>o.picker==u.id)):OB(['pickedup']);
 const g={};src.forEach(o=>(g[o.apt]=g[o.apt]||[]).push(o));
 return Object.keys(g).map(id=>{const a=apt(+id),k=g[id].length;return `<button class="card nx" data-apt="${id}" onclick="nvOpen('${kind=='pickup'?'apt':'adel'}',${id})"><span class="ico">${ic('bld',24)}</span><div class="grow"><b>${esc(a.name)}</b><div class="mu">${k} flat${k>1?'s':''} · ${a.sch[td]||Object.values(a.sch)[0]||'No slot'}</div></div>${ic('r',20)}</button>`}).join('')||`<div class="card mu center">${kind=='pickup'?'No pickups pending.':'Nothing to deliver.'}</div>`;
}
function pickV(u){
 const pc=OB(['booked','accepted']).length,dc=OB(['pickedup']).length;
 const nav=navHtml([['home','Home','home'],['route','Route','route',(pc+dc)||''],['hist','History','clock'],['prof','Profile','user']]);
 let h;
 if(V.sub=='notif')h=notifV(u);else if(V.sub=='apt')h=pApt(u);else if(V.sub=='adel')h=pAdel(u);
 else if(V.tab=='home')h=pHome(u,pc,dc);else if(V.tab=='route')h=pRoute(u,pc,dc);else if(V.tab=='hist')h=pHist(u);else h=profV(u);
 return {h,nav};
}
function pHome(u,pc,dc){
 const td=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
 return bar(u)+`<div class="card dd"><span class="ico">${ic('cal',22)}</span><b>Today, ${td}</b></div>`
 +`<div class="two"><div class="card stat">${ic('bag',30)}<div><b>${pc}</b><span>Pickups</span></div></div><div class="card stat">${ic('truck',30)}<div><b>${dc}</b><span>Deliveries</span></div></div></div>`
 +seg([['pickup','Pickup ('+pc+')'],['delivery','Delivery ('+dc+')']],V.seg,'seg')+aptRows(u,V.seg=='delivery'?'delivery':'pickup')
 +`<button class="btn w" id="startr" style="margin-top:6px" onclick="V.wseg='collect';nvTab('route')">${ic('route',20)} Start Route</button>`;
}
function dropPanel(L,all){return `<h3 class="sec">${all?'All flats collected ✓ – ':''}Drop lot to iron man</h3>`+L.map(o=>`<label class="card row" style="cursor:pointer"><div><span class="lbl">${esc(code(o))}</span><div class="mu">Flat ${esc(o.flat)} · ${o.collected} pcs<br>${esc(ite(o))}</div></div><input type="checkbox" id="dk${o.id}" checked></label>`).join('')+`<div class="card"><h3>Select iron man</h3><select id="dp">${S.partners.filter(p=>p.ok).map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.area)} · free ${p.cap-load(p)}</option>`).join('')}</select><button class="btn w" id="dropb" style="margin-top:8px" onclick="dropLot()">Drop lot &amp; notify iron man</button></div>`}
function flatCard(u,o){
 const body=o.status=='booked'?`<button class="btn w" onclick="accept(${o.id})">Accept pickup</button>`
 :o.picker==u.id?`<div class="mu">Collection form – enter what you actually collect:</div>${Object.keys(o.items).map((k,i)=>`<div class="item"><span>${esc(k)} <span class="mu">booked ${o.items[k]}</span></span><input class="s" id="c${o.id}_${i}" type="number" inputmode="numeric" min="0" value="${o.items[k]}"></div>`).join('')}<button class="btn w" style="margin-top:10px" onclick="collect2(${o.id})">Mark pickup completed</button>`
 :`<div class="mu">Accepted by another pickup person</div>`;
 return `<div class="card"><div class="row"><b>Flat ${esc(o.flat)} ${o.tag?tagPill(o.tag):''}</b><span class="lbl">${esc(code(o))}</span></div><div class="mu" style="margin:6px 0">${esc(o.name||'')} · <a href="tel:${esc(o.phone||'')}">Call customer</a> · ${esc(o.slot)}<br>${esc(ite(o))}</div>${o.note?`<div class="warn">Note: ${esc(o.note)}</div>`:''}${body}</div>`;
}
function pApt(u){
 const a=apt(V.arg);if(!a)return hdr('Apartment')+'<div class="card mu center">Not found.</div>';
 const tc=OB(['booked','accepted']).filter(o=>o.apt==a.id).sort(byFlat),cl=OB(['collected']).filter(o=>o.apt==a.id&&o.picker==u.id);
 let h=hdr(esc(a.name))+`<div class="mu">${esc(a.area)} · ${mapA(a,'Open apartment in Maps')}</div>`+seg([['col','To Collect ('+tc.length+')'],['dn','Collected ('+cl.length+')']],V.aseg,'aseg');
 if(V.aseg=='col')h+=tc.map(o=>flatCard(u,o)).join('')||'<div class="card mu center">All flats collected ✓</div>';
 else h+=(cl.map(o=>`<div class="card"><div class="row"><b>Flat ${esc(o.flat)}</b><span class="pill">Collected</span></div><div class="lc2"><span class="lbl">${esc(code(o))}</span><div class="mu" style="margin-top:6px">Write this on the bag · ${o.collected} pcs</div></div><div class="mu">${esc(ite(o))}</div></div>`).join('')||'<div class="card mu center">Nothing collected yet.</div>')+(cl.length?dropPanel(cl,!tc.length):'');
 return h;
}
function pAdel(u){
 const a=apt(V.arg);if(!a)return hdr('Deliver')+'<div class="card mu center">Not found.</div>';
 const L=OB(['pickedup']).filter(o=>o.apt==a.id).sort(byFlat);
 return hdr(esc(a.name))+`<div class="mu">${esc(a.area)} · ${mapA(a,'Open apartment in Maps')}</div><h3 class="sec">Deliver to flats</h3>`
 +(L.map(o=>`<div class="card"><div class="row"><b>Flat ${esc(o.flat)} ${o.tag?tagPill(o.tag):''}</b><span class="lbl">${esc(code(o))}</span></div><div class="mu" style="margin:6px 0">${esc(o.name||'')} · <a href="tel:${esc(o.phone||'')}">Call customer</a><br>${esc(ite(o))}</div><button class="btn w" onclick="deliver(${o.id})">Mark delivered</button></div>`).join('')||'<div class="card mu center">All delivered ✓</div>');
}
function pDrop(u){
 const mc=OB(['collected']).filter(o=>o.picker==u.id),dr=OB(['dropped','ironing','qc','flagged','approved']).filter(o=>o.picker==u.id);
 return (mc.length?dropPanel(mc,true):'<div class="card mu center">No collected bundles waiting to be dropped.</div>')+'<h3 class="sec">With iron men</h3>'
 +(S.partners.filter(p=>dr.some(o=>o.partner==p.id)).map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="mu">${mapA(p)}${p.phone?` · <a href="tel:${esc(p.phone)}">Call</a>`:''}</div>${dr.filter(o=>o.partner==p.id).map(o=>`<div class="item"><span>${esc(apt(o.apt).name)} · Flat ${esc(o.flat)}</span>${pill(o)}</div>`).join('')}</div>`).join('')||'<div class="card mu center">Nothing dropped yet.</div>');
}
function pRet(u){
 const hd=o=>`<div class="row"><span class="lbl">${esc(code(o))}</span>${pill(o)}</div>`;
 const link=o=>{const p=pr(o.partner)||{};return `${esc(p.name||'')} · ${mapA(p)}${p.phone?` · <a href="tel:${esc(p.phone)}">Call</a>`:''}`};
 let h=OB(['qc','flagged']).map(o=>{
  const act=o.status=='qc'?`<div class="card" style="margin:8px 0;padding:4px 12px">${['Creases removed','No stains or burns','Folded, count matches'].map((t,i)=>`<label class="item"><span>${t}</span><input type="checkbox" id="k${o.id}_${i}"></label>`).join('')}</div><button class="btn w" onclick="qcOk(${o.id})">${o.warn?'Approve anyway':'Approve order'}</button><div class="row" style="margin-top:8px"><select id="fr${o.id}" style="margin:0">${['Missing item','Poor ironing','Stain or burn','Wrong count','Other'].map(r=>`<option>${r}</option>`).join('')}</select><button class="btn r sm" onclick="flag2(${o.id})">Flag</button></div>`
  :`<div class="warn">Flagged: ${esc(o.flag)}</div><button class="btn g w" onclick="rework(${o.id})">Send back to iron man</button>`;
  return `<div class="card">${hd(o)}<div class="mu" style="margin:6px 0">${esc(apt(o.apt).name)} · Flat ${esc(o.flat)}<br>${esc(ite(o))}<br>${link(o)}</div><div class="row" style="margin:8px 0">${cnL('Booked',cnt(o))}${cnL('Collected',o.collected,o.collected!=cnt(o))}${cnL('Received',o.received,o.received!=o.collected)}${cnL('Ironed',o.doneQty,o.doneQty!=o.received)}</div>${o.warn?`<div class="warn">⚠ ${esc(o.warn)}</div>`:''}${act}</div>`}).join('')||'<div class="card mu center">Nothing awaiting quality check.</div>';
 h+='<h3 class="sec">Pick up from iron man</h3>'+(OB(['approved']).map(o=>`<div class="card">${hd(o)}<div class="mu" style="margin:6px 0">${esc(apt(o.apt).name)} · Flat ${esc(o.flat)}<br>${link(o)}</div><button class="btn w" onclick="pickRet(${o.id})">Picked up from iron man</button></div>`).join('')||'<div class="card mu center">Nothing ready for pickup.</div>');
 return h;
}
function pRoute(u,pc,dc){
 const nd=OB(['collected']).filter(o=>o.picker==u.id).length,nr=OB(['qc','flagged','approved']).length;
 let h=`<h1 class="ttl">Today's Route</h1>`+seg([['collect','Collect ('+pc+')'],['drop','Drop ('+nd+')'],['ret','Return ('+nr+')'],['deliver','Deliver ('+dc+')']],V.wseg,'wseg');
 return h+(V.wseg=='collect'?aptRows(u,'pickup'):V.wseg=='drop'?pDrop(u):V.wseg=='ret'?pRet(u):aptRows(u,'delivery'));
}
function pHist(u){
 const L=OB(['delivered']).filter(o=>o.picker==u.id).slice().reverse();
 return `<h1 class="ttl">History</h1><div class="card stat">${ic('ok',30)}<div><b>${L.length}</b><span>Orders delivered</span></div></div>`+(L.map(o=>`<div class="card row"><div><b>Bag #${esc(code(o))}</b><div class="mu">${esc(apt(o.apt).name)} · Flat ${esc(o.flat)} · ${cnt(o)} items</div></div><span class="pill">Delivered</span></div>`).join('')||'<div class="card mu center">No deliveries yet.</div>');
}
/* ================= iron man ================= */
const GRP={iron:['dropped'],prog:['ironing','flagged'],comp:['qc','approved','pickedup','delivered']};
function ironV(u,p){
 const mo=S.orders.filter(o=>o.partner==p.id),c=k=>mo.filter(o=>GRP[k].includes(o.status));
 const nav=navHtml([['home','Home','home'],['bags','Bags','bag',c('iron').length||''],['hist','History','clock'],['prof','Profile','user']]);
 let h;
 if(V.sub=='notif')h=notifV(u);else if(V.sub=='bag')h=iBag(p,mo);
 else if(V.tab=='home')h=iHome(u,mo,c);else if(V.tab=='bags')h=iBags(c);else if(V.tab=='hist')h=iHist(mo);else h=profV(u);
 return {h,nav};
}
const earn=mo=>{const e=mo.filter(o=>o.payout);return {pend:e.filter(o=>!o.paid).reduce((s,o)=>s+o.payout,0),paid:e.filter(o=>o.paid).reduce((s,o)=>s+o.payout,0)}};
function iHome(u,mo,c){
 const e=earn(mo),nt=notesFor(u).slice(0,2);
 return bar(u)+`<h3 class="sec" style="margin-top:4px">Today's Work</h3><div class="g2">${[['Received',mo.length,'bag'],['To Iron',c('iron').length,'layers'],['In Progress',c('prog').length,'clock'],['Completed',c('comp').length,'ok']].map(x=>`<div class="card stat2">${ic(x[2],28)}<b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>`
 +`<button class="btn w" id="queue" onclick="V.bseg='iron';nvTab('bags')">View Bag Queue ${ic('r',18)}</button>`
 +`<button class="card nx" style="margin-top:10px" onclick="V.bseg='comp';nvTab('bags')"><span class="ico">${ic('truck',22)}</span><div class="grow"><b>Handover to Pickup</b><div class="mu">Ready bags (${mo.filter(o=>o.status=='approved').length})</div></div>${ic('r',20)}</button>`
 +`<button class="card nx" onclick="nvTab('hist')"><span class="ico">${ic('chart',22)}</span><div class="grow"><b>My Earnings</b><div class="mu">₹${e.pend} pending · ₹${e.paid} paid</div></div>${ic('r',20)}</button>`
 +(nt.length?`<h3 class="sec">Latest notifications</h3>`+nt.map(notifCard).join(''):'');
}
function bagRow(o){return `<button class="card nx" data-bag="${o.id}" onclick="nvOpen('bag',${o.id})"><span class="ico">${ic('bag',22)}</span><div class="grow"><b>Bag #${esc(code(o))}</b><div class="mu">${esc(apt(o.apt).name)} · ${o.received||o.collected||cnt(o)} items</div></div>${pill(o)}${ic('r',18)}</button>`}
function iBags(c){
 return `<h1 class="ttl">Bags</h1>`+seg([['iron','To Iron ('+c('iron').length+')'],['prog','In Progress ('+c('prog').length+')'],['comp','Completed ('+c('comp').length+')']],V.bseg,'bseg')+(c(V.bseg).map(bagRow).join('')||'<div class="card mu center">No bags here.</div>');
}
function iBag(p,mo){
 const o=mo.find(x=>x.id==V.arg);if(!o)return hdr('Bag')+'<div class="card mu center">Bag not found.</div>';
 const it=o.coll||o.items,pg=o.prog||{},dn=Object.values(pg).reduce((a,b)=>a+b,0),fin=['qc','approved','pickedup','delivered'].includes(o.status);
 const rows=Object.keys(it).map(k=>`<div class="it"><span class="ico sm">${ic(ITI[k]||'shirt',20)}</span><div class="grow"><b>${esc(k)}</b><div class="mu">Qty ${it[k]}</div></div>`+(o.status=='ironing'?`<div class="q"><button aria-label="Less ${k}" onclick="ip(${o.id},'${k}',-1)">−</button><b>${pg[k]||0}/${it[k]}</b><button aria-label="More ${k}" onclick="ip(${o.id},'${k}',1)">+</button></div>`:`<span class="chip">${fin?(pg[k]!=null?pg[k]:it[k])+'/'+it[k]+' ✓':it[k]}</span>`)+`</div>`).join('');
 let act='';
 if(o.status=='dropped')act=`<div class="card"><div class="mu">Clothes received</div><input class="s" id="r${o.id}" type="number" inputmode="numeric" min="0" value="${o.collected}"><div class="mu">Expected ${o.collected}. Enter the actual number you received.</div></div><button class="btn w" id="startiron" onclick="recv(${o.id})">Start Ironing</button>`;
 else if(o.status=='ironing')act=`<div class="card"><div class="row"><b>Ironing in progress</b><span class="mu">${dn} of ${o.received} items</span></div><div class="pb"><i style="width:${Math.min(100,Math.round(100*dn/(o.received||1)))}%"></i></div></div>${o.warn?`<div class="warn">⚠ ${esc(o.warn)}</div>`:''}<button class="btn g w" onclick="toast('Progress saved')">Update Progress</button><button class="btn w" id="submitqc" onclick="done(${o.id})">Submit for quality check</button>`;
 else if(o.status=='flagged')act=`<div class="warn">Quality check flagged: ${esc(o.flag||'')}. The pickup person will bring it back to you.</div>`;
 else if(o.status=='qc')act=`<div class="card center"><b>Waiting for quality check</b><div class="mu">${o.doneQty} of ${o.received} items submitted.</div></div>`;
 else if(o.status=='approved')act=`<div class="card center"><span class="bigok">${ic('ok',44)}</span><h3>Ironing Completed</h3><div class="mu">Ready for the pickup person to collect.</div></div>`;
 else act=`<div class="card center"><b>Handed over to pickup person</b></div>`;
 return hdr('Bag #'+esc(code(o)))+`<div class="mu">${esc(apt(o.apt).name)}, ${esc(o.flat)} ${o.tag?tagPill(o.tag):''}</div>${pkBox(o,1)}<h3 class="sec">Items (${o.coll?o.collected:cnt(o)})</h3><div class="card">${rows}</div>${o.note?`<div class="card"><b>Instructions</b><div class="mu">${esc(o.note)}</div></div>`:''}${act}`;
}
function ip(id,k,d){const o=S.orders.find(x=>x.id==id),mx=(o.coll||o.items)[k]||0;o.prog=o.prog||{};o.prog[k]=Math.min(mx,Math.max(0,(o.prog[k]||0)+d));R()}
function recv(id){const o=S.orders.find(x=>x.id==id),el=$('r'+id);o.received=+(el?el.value:o.collected);o.status='ironing';o.prog={};lg(o,'Received by '+pr(o.partner).name+' – ironing started');if(o.received!=o.collected)o.warn='Partner received '+o.received+' vs collected '+o.collected;toast('Ironing started');R()}
function done(id){
 const o=S.orders.find(x=>x.id==id),v=Object.values(o.prog||{}).reduce((a,b)=>a+b,0),p=pr(o.partner);
 if(!v)return toast('Mark at least one item as ironed');
 o.doneQty=v;if(v!=o.received)o.warn=(o.warn?o.warn+'; ':'')+'Ironed '+v+' vs received '+o.received;
 o.status='qc';lg(o,'Ironed – at quality check');ntP('Ironed, ready for quality check: '+code(o)+' at '+p.name,p.phone,p.name);toast('Submitted for quality check');R();
}
function iHist(mo){
 const e=earn(mo);
 return `<h1 class="ttl">My Earnings</h1><div class="card center"><div class="mu">Total earned</div><b style="font-size:30px">₹${e.pend+e.paid}</b></div><div class="g2"><div class="card stat2"><b>₹${e.pend}</b><span>Pending payout</span></div><div class="card stat2"><b>₹${e.paid}</b><span>Paid</span></div></div><h3 class="sec">Completed bags</h3>`
 +(mo.filter(o=>GRP.comp.includes(o.status)).map(o=>`<div class="card row"><div><b>Bag #${esc(code(o))}</b><div class="mu">${esc(apt(o.apt).name)} · ${cnt(o)} items</div></div><div style="text-align:right">${o.payout?`<b>₹${o.payout}</b><div class="mu">${o.paid?'Paid':'Pending'}</div>`:'<span class="mu">Awaiting QC</span>'}</div></div>`).join('')||'<div class="card mu center">No completed bags yet.</div>');
}
/* ================= admin shell ================= */
function adminV(){
 const nav=[['Overview','Overview','chart'],['Approvals','Approvals','ok'],['Setup','Setup','cog'],['Pricing','Pricing','tagi'],['Payouts','Payouts','wallet']].map(([id,l,i])=>`<button class="${atab==id?'on':''}" data-tab="${id}" onclick="atab='${id}';window.scrollTo(0,0);R()">${ic(i,24)}<span>${l}</span></button>`).join('');
 return {h:`<div class="bar"><span class="av" style="background:var(--tint);color:var(--nv)">${ic('cog',24)}</span><div class="grow"><div class="hi">Hi, Admin</div><div class="mu">Administrator</div></div><button id="lo" class="bell" aria-label="Log out" onclick="appLogout()">${ic('out',24)}</button></div>`+admin(),nav};
}
R();

</script></body></html>
